# ==============================================================================
# DIGITALFIX - DOCKER COMPOSE CENTRALIZADO (DESARROLLO LOCAL)
# ==============================================================================
# Orquesta la plataforma completa de DigitalFix desde una sola ubicación:
#   - 1 Frontend Angular SSR
#   - 7 Microservicios Spring Boot (Login, User, Workorders, Catalog, Notify, Admin Queues, Report)
#   - 1 BFF / API Gateway (valida el JWT y enruta a los microservicios)
#   - 1 Clúster RabbitMQ de 2 nodos (rabbitmq-node1 + rabbitmq-node2)
#   - 1 Broker Apache Kafka en modo KRaft (kafka)
#
# Uso rápido:
#   cd digitalfix-infrastructure
#   docker compose up -d --build
#
# Gestión de variables:
#   - Carga de forma centralizada "digitalfix-infrastructure/.env".
#   - Si existen variables locales en los repositorios individuales, se combinan
#     sin generar errores en caso de que falten (required: false).
# ==============================================================================

networks:
  digitalfix-net:
    name: digitalfix-net
    driver: bridge

volumes:
  kafka-data:

services:

  # ----------------------------------------------------------------------------
  # 1. Broker de Mensajería: Clúster RabbitMQ de 2 nodos con Consola Web
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: digitalfix-rabbitmq-node1
    mem_limit: ${RABBITMQ_MEMORY:-384m}
    hostname: rabbitmq-node1
    expose:
      - "5672" # AMQP
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Consola web de administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-digitalfix-cluster-cookie}
    volumes:
      - ./mq/rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    networks:
      digitalfix-net:
        aliases:
          - rabbitmq-node1 # nombre que usa node2 para encontrarlo
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq-node2:
    image: rabbitmq:3.12-management-alpine
    container_name: digitalfix-rabbitmq-node2
    mem_limit: ${RABBITMQ_MEMORY:-384m}
    hostname: rabbitmq-node2
    expose:
      - "5672" # AMQP
    ports:
      - "127.0.0.1:${RABBITMQ_NODE2_MANAGEMENT_PORT:-15673}:15672" # Consola web del nodo 2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-digitalfix-cluster-cookie}
    volumes:
      - ./mq/rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    networks:
      - digitalfix-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 1b. Broker de Eventos: Apache Kafka (modo KRaft, sin Zookeeper)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: digitalfix-kafka
    hostname: kafka
    mem_limit: ${KAFKA_MEMORY:-512m}
    expose:
      - "9092" # Clientes internos en digitalfix-net
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094" # Acceso opcional desde el host (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - digitalfix-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  # ----------------------------------------------------------------------------
  ms-login:
    build:
      context: ../digitalfix-ms-login
      dockerfile: Dockerfile
    container_name: ms-login-service
    mem_limit: ${MS_LOGIN_MEMORY:-448m}
    expose:
      - "8081"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=8081
      - SERVER_PORT=8081
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - DB_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - MS_USER_URL=http://ms-user-service:8082
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    volumes:
      - ../digitalfix-ms-login/wallet:/app/wallet:ro
    networks:
      - digitalfix-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Microservicio de Usuarios y Clientes (digitalfix-ms-user)
  # ----------------------------------------------------------------------------
  ms-user:
    build:
      context: ../digitalfix-ms-user
      dockerfile: Dockerfile
    container_name: ms-user-service
    mem_limit: ${MS_USER_MEMORY:-448m}
    expose:
      - "8082"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=8082
      - SERVER_PORT=8082
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - DB_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    volumes:
      - ../digitalfix-ms-user/wallet:/app/wallet:ro
    networks:
      - digitalfix-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 4. Microservicio de Órdenes de Trabajo (digitalfix-ms-workorders)
  # ----------------------------------------------------------------------------
  ms-workorders:
    build:
      context: ../digitalfix-ms-workorders
      dockerfile: Dockerfile
    container_name: ms-workorders-service
    mem_limit: ${MS_WORKORDERS_MEMORY:-448m}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${MS_WORKORDERS_HOST_PORT:-8085}:8080" # Acceso del portal cliente (monolito) desde el host
    env_file:
      - path: .env
        required: true
    environment:
      - SERVER_PORT=8080
      - PORT=8080
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - DB_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - MS_USER_URL=http://ms-user-service:8082
      - MS_CATALOG_URL=http://ms-catalog-service:8080
      - MS_ADMIN_QUEUES_URL=http://ms-admin-queues:8084
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    volumes:
      - ../digitalfix-ms-workorders/wallet:/app/wallet:ro
    networks:
      - digitalfix-net
    depends_on:
      kafka:
        condition: service_healthy
      ms-catalog:
        condition: service_started
      ms-admin-queues:
        condition: service_started
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 5. Microservicio de Catálogo de Servicios y Repuestos (digitalfix-ms-catalog)
  # ----------------------------------------------------------------------------
  ms-catalog:
    build:
      context: ../digitalfix-ms-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog-service
    mem_limit: ${MS_CATALOG_MEMORY:-448m}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${MS_CATALOG_HOST_PORT:-8088}:8080" # Acceso del portal cliente (monolito) desde el host
    env_file:
      - path: .env
        required: true
    environment:
      - SERVER_PORT=8080
      - PORT=8080
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - DB_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - MS_USER_URL=http://ms-user-service:8082
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    volumes:
      - ../digitalfix-ms-catalog/wallet:/app/wallet:ro
    networks:
      - digitalfix-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 6. Microservicio de Notificaciones y Despacho (digitalfix-ms-notify)
  # ----------------------------------------------------------------------------
  ms-notify:
    build:
      context: ../digitalfix-ms-notify
      dockerfile: Dockerfile
    container_name: ms-digitalfix-notify
    mem_limit: ${MS_NOTIFY_MEMORY:-320m}
    expose:
      - "8083"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=8083
      - SERVER_PORT=8083
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    networks:
      - digitalfix-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 7. Mensajería centralizada (digitalfix-ms-admin-queues)
  # ----------------------------------------------------------------------------
  ms-admin-queues:
    build:
      context: ../digitalfix-ms-admin-queues
      dockerfile: Dockerfile
    container_name: ms-admin-queues
    mem_limit: ${MS_ADMIN_QUEUES_MEMORY:-320m}
    expose:
      - "8084"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=8084
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_ADDRESSES=${RABBITMQ_ADDRESSES:-rabbitmq-node1:5672,rabbitmq-node2:5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST:-/}
      - MS_NOTIFY_URL=http://ms-digitalfix-notify:8083
      - MS_USER_URL=http://ms-user-service:8082
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    networks:
      - digitalfix-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-node2:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ms-notify:
        condition: service_started
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 8. Microservicio de Reportes y KPIs (digitalfix-ms-report)
  # ----------------------------------------------------------------------------
  ms-report:
    build:
      context: ../digitalfix-ms-report
      dockerfile: Dockerfile
    container_name: ms-report-service
    mem_limit: ${MS_REPORT_MEMORY:-448m}
    expose:
      - "8086"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=8086
      - SERVER_PORT=8086
      - MS_USER_URL=http://ms-user-service:8082
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - SPRING_FLYWAY_TABLE=flyway_schema_history_report
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_ISSUER_URI=${JWT_ISSUER_URI:-https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    volumes:
      - ../digitalfix-ms-report/wallet:/app/wallet:ro
    networks:
      - digitalfix-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 9. BFF / API Gateway (digitalfix-bff-gateway)
  # ----------------------------------------------------------------------------
  bff-gateway:
    build:
      context: ../digitalfix-bff-gateway
      dockerfile: Dockerfile
    container_name: digitalfix-bff-gateway
    mem_limit: ${BFF_MEMORY:-320m}
    ports:
      - "${BFF_PORT:-8090}:8090"
    env_file:
      - path: .env
        required: true
    environment:
      - SERVER_PORT=8090
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - MS_LOGIN_URL=http://ms-login-service:8081
      - MS_USER_URL=http://ms-user-service:8082
      - MS_WORKORDERS_URL=http://ms-workorders-service:8080
      - MS_CATALOG_URL=http://ms-catalog-service:8080
      - MS_ADMIN_QUEUES_URL=http://ms-admin-queues:8084
      - MS_REPORT_URL=http://ms-report-service:8086
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    networks:
      - digitalfix-net
    depends_on:
      - ms-login
      - ms-user
      - ms-workorders
      - ms-catalog
      - ms-admin-queues
      - ms-report
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 10. Frontend Web SPA / SSR (digitalfix-frontend)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../digitalfix-frontend
      dockerfile: Dockerfile
    container_name: digitalfix-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - digitalfix-net
    restart: unless-stopped
