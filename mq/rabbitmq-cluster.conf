# ==============================================================================
# DIGITALFIX - FORMACIÓN DEL CLÚSTER RABBITMQ (2 NODOS)
# ==============================================================================
# Se monta en /etc/rabbitmq/conf.d/20-cluster.conf de ambos nodos.
# Al arrancar, cada nodo busca a sus pares en esta lista y se une al que ya
# esté corriendo (node1 arranca primero; node2 se une a él).
# Requisitos: ambos nodos comparten la misma Erlang cookie
# (RABBITMQ_ERLANG_COOKIE) y se resuelven por nombre dentro de digitalfix-net.
# Verificación: docker exec digitalfix-rabbitmq-node1 rabbitmqctl cluster_status
# ==============================================================================

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-node1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-node2

# Con 2 nodos, pause_minority pausaría ambos ante una partición de red:
# autoheal elige un nodo ganador y reinicia el otro al recuperarse la red.
cluster_partition_handling = autoheal
